name: CI/CD

# Single pipeline so the deploy is gated on a green CI:
#   PR   → ci + docker-build (validate the image builds, no registry push)
#   main → ci → deploy (build + push to GHCR; Watchtower picks it up ~5 min)
#
# The job name `ci` is the required status check referenced by the `protect-main`
# ruleset (see docs/REPO_SETUP_CHECKLIST.md).
#
# Third-party actions are pinned to a full commit SHA (issue #2): a mutable tag
# can be overwritten by the action owner to inject code that runs on the runner
# with GITHUB_TOKEN (supply-chain RCE; cf. tj-actions/changed-files CVE-2025-30066).
# The `# vX.Y.Z` comment is what the `github-actions` Dependabot ecosystem reads to
# keep these SHAs current (see .github/dependabot.yml) — so pinning costs no manual upkeep.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual redeploy: re-run the pipeline on `main` (build + push to GHCR) so a
  # changed repo variable/secret (e.g. NUXT_PUBLIC_SITE_URL) is re-baked without a
  # code commit. Deploy still only pushes on the `main` ref (the deploy job's `if`).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only superseded PR runs; never abort an in-flight `main` deploy
  # mid-push to GHCR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# CI never takes screenshots, so don't let the `playwright` devDependency pull a
# browser during install. Visual verification uses the pre-installed Chromium in
# the dev/web environment (see docs/VISUAL_VERIFICATION.md).
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    # The `nuxt` Vitest project boots a Nuxt runtime on top of lint/typecheck/generate.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version is read from the "packageManager" field in package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxi prepare
        # Generates .nuxt/eslint.config.mjs and the tsconfigs that lint / typecheck
        # depend on — both .nuxt/tsconfig.json (app) and .nuxt/tsconfig.server.json
        # (server/**, checked by the second vue-tsc pass in `pnpm typecheck`).

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build (nuxt generate)
        run: pnpm generate

  visual:
    name: visual
    # Визуальные регресс-тесты (#3): собранная статика × ключевые экраны × light/dark ×
    # mobile/desktop, сравнение с эталонами из tests/visual/__screenshots__.
    #
    # Отдельной джобой, а не шагом в `ci`: она тянет браузер (~120 МБ) и идёт минуты, то есть
    # удваивала бы время обратной связи по lint/typecheck/тестам — тем проверкам, которые чаще
    # всего и краснеют.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Браузер ставим playwright'ом, а не берём системный: эталоны привязаны к КОНКРЕТНОЙ
      # сборке Chromium, которую пинит версия пакета. Возьми мы системный — снимки разъехались бы
      # с эталонами на ровном месте, и тест выродился бы в шум, который все научились игнорировать.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (nuxt generate)
        run: pnpm generate

      - name: Visual regression
        run: pnpm test:visual

      # Артефакты только при падении — по diff-картинке сразу видно, что именно уехало.
      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff
          path: |
            tests/visual/.artifacts/
            playwright-report/
          retention-days: 7

  docker-build:
    name: docker-build
    # Validate ALL production images build on every PR: the nginx static landing
    # (`runner`), the Nitro node backend (`backend`) and the BY-crypto gateway
    # (`crypto-gw`). Catches Dockerfile / base-image breakage before it reaches main
    # and the GHCR deploy. No push.
    # Runs on Dependabot PRs too — that is exactly where a node bump would surface.
    #
    # `crypto-gw` lives in its own context (deploy/crypto-gateway) because it shares
    # nothing with the node image — different base, different toolchain. Its build
    # compiles OpenSSL and nginx from source, so the FIRST run is slow (hence the
    # timeout below); afterwards the gha cache makes it a no-op unless that directory
    # actually changed. Its build gates are the point: they fail the PR when the BTLS
    # patch stops applying or the CA bundle stops verifying the bank's certificate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      # WITHOUT THIS a failure in one leg cancels the others. The gateway leg clones
      # bee2evp from GitHub and compiles OpenSSL, so it is the leg most likely to fail
      # for reasons that have nothing to do with the PR (network, rate limit, upstream
      # moved). Letting that cancel the `runner`/`backend` builds would break the
      # assumption docs/REPO_SETUP_CHECKLIST.md relies on — that an image-build failure
      # is harmless because the other images still build.
      fail-fast: false
      matrix:
        include:
          - target: runner
            context: .
          - target: backend
            context: .
          - target: crypto-gw
            context: deploy/crypto-gateway

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          # READ-only on purpose. A cache written from refs/pull/N/merge is readable by
          # that PR alone, never by another PR or by main, but it still counts against the
          # repo-wide 10 GB budget — and a from-source OpenSSL+nginx build is several GB.
          # Writing here would evict the main-scope caches this job actually reads from.
          # Only the deploy job (runs on main) writes a cache anyone else can use.
          cache-from: type=gha,scope=${{ matrix.target }}
          # The gateway leg is also RUN below, so it has to land in the local daemon under
          # a predictable name (buildx needs a tag to load at all).
          load: ${{ matrix.target == 'crypto-gw' }}
          tags: ${{ matrix.target }}:ci

      # `docker build` proves the crypto stack compiles and the CA chain verifies — it does
      # NOT prove the container starts. Everything between the two lives in entrypoint.sh:
      # the envsubst render, `nginx -t`, the CA gates, dropping to an unprivileged user, and
      # a healthcheck written against bash's /dev/tcp. All of that would otherwise be first
      # executed on the deploy server, during a release.
      # No bank is involved: GW_UPSTREAM_HOST is an IP literal (so nginx needs no DNS and
      # `nginx -t` cannot fail on a lookup) and /healthz never touches the upstream.
      - name: Smoke test — the gateway actually starts and answers
        if: matrix.target == 'crypto-gw'
        run: |
          set -euo pipefail
          docker run -d --name gw-smoke -p 127.0.0.1:1080:1080 \
            -e GW_UPSTREAM_HOST=127.0.0.1 -e GW_UPSTREAM_PORT=9345 \
            crypto-gw:ci
          for i in $(seq 1 20); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gw-smoke)" = healthy ] && break
            sleep 2
          done
          docker logs gw-smoke
          test "$(docker inspect -f '{{.State.Health.Status}}' gw-smoke)" = healthy
          # The route allowlist is the gateway's only security boundary — assert it from
          # outside, not by reading the config.
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:1080/healthz)" = 200
          test "$(code http://127.0.0.1:1080/)" = 404
          test "$(code http://127.0.0.1:1080/open-banking-authorize/v1.0/oauth2/token)" = 403
          test "$(code -X DELETE http://127.0.0.1:1080/open-banking/v1.0/accounts)" = 403
          # Runs unprivileged.
          test "$(docker exec gw-smoke id -u)" = 10001
          docker rm -f gw-smoke

  deploy:
    name: Build & Push to GHCR
    needs: ci
    # Gate the deploy on CI: a red CI blocks images from ever reaching GHCR /
    # Watchtower. Only the main branch deploys (via a push or a manual
    # workflow_dispatch redeploy). Publishes three images:
    #   runner    → ghcr.io/<repo>             (nginx static landing + B24-iframe UI)
    #   backend   → ghcr.io/<repo>-backend     (Nitro node: B24 webhooks + token store)
    #   crypto-gw → ghcr.io/<repo>-crypto-gw   (BY-crypto TLS gateway to Priorbank prod)
    # The gateway is published so the deploy server never has to compile OpenSSL —
    # it is pulled like the other two, and the compose service is commented out until
    # someone deliberately enables it (docker-compose.prod.yml, `crypto-gw`).
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    strategy:
      # Same reason as docker-build, and it matters more here: a failed gateway build must
      # never stop `runner`/`backend` from reaching GHCR. The gateway is an optional,
      # switched-off component; the other two are the product.
      fail-fast: false
      matrix:
        include:
          - target: runner
            suffix: ''
            context: .
          - target: backend
            suffix: '-backend'
            context: .
          - target: crypto-gw
            suffix: '-crypto-gw'
            context: deploy/crypto-gateway

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # built-in, no extra secret needed

      # Дата КОММИТА для <lastmod> в sitemap.xml (#425). Не `date -u`: стенные часы объявляли бы
      # «сегодня» на каждый передеплой неизменённого коммита, а поисковики такое обесценивают.
      - name: Commit date for sitemap lastmod
        id: builddate
        run: echo "date=$(git show -s --format=%cs ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the Nuxt images declare these; the gateway context consumes none of them
          # and BuildKit therefore warns "build-args were not consumed" on its leg. That is
          # cosmetic and it stays: making the list conditional needs a multi-line value
          # built inside an expression, and YAML folds those continuation lines into
          # spaces — the four arguments would arrive as one mangled string.
          build-args: |
            NUXT_PUBLIC_AUTHOR_NAME=${{ vars.NUXT_PUBLIC_AUTHOR_NAME }}
            NUXT_PUBLIC_AUTHOR_URL=${{ vars.NUXT_PUBLIC_AUTHOR_URL }}
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
            NUXT_PUBLIC_BUILD_DATE=${{ steps.builddate.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
