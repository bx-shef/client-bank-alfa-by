name: CI/CD

# Single pipeline so the deploy is gated on a green CI:
#   PR   → ci + docker-build (validate the image builds, no registry push)
#   main → ci → deploy (build + push to GHCR; Watchtower picks it up ~5 min)
#
# The job name `ci` is the required status check referenced by the `protect-main`
# ruleset (see docs/REPO_SETUP_CHECKLIST.md).
#
# Third-party actions are pinned to a full commit SHA (issue #2): a mutable tag
# can be overwritten by the action owner to inject code that runs on the runner
# with GITHUB_TOKEN (supply-chain RCE; cf. tj-actions/changed-files CVE-2025-30066).
# The `# vX.Y.Z` comment is what the `github-actions` Dependabot ecosystem reads to
# keep these SHAs current (see .github/dependabot.yml) — so pinning costs no manual upkeep.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual redeploy: re-run the pipeline on `main` (build + push to GHCR) so a
  # changed repo variable/secret (e.g. NUXT_PUBLIC_SITE_URL) is re-baked without a
  # code commit. Deploy still only pushes on the `main` ref (the deploy job's `if`).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only superseded PR runs; never abort an in-flight `main` deploy
  # mid-push to GHCR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Don't let the `playwright` devDependency pull a browser during `pnpm install` — the `ci` job
# doesn't need one. The `visual` job DOES take screenshots and installs the browser explicitly
# (`playwright install`), which this variable does not affect: it only gates the postinstall hook.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    # The `nuxt` Vitest project boots a Nuxt runtime on top of lint/typecheck/generate.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # Version is read from the "packageManager" field in package.json.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt
        run: pnpm exec nuxi prepare
        # Generates .nuxt/eslint.config.mjs and the tsconfigs that lint / typecheck
        # depend on — both .nuxt/tsconfig.json (app) and .nuxt/tsconfig.server.json
        # (server/**, checked by the second vue-tsc pass in `pnpm typecheck`).

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build (nuxt generate)
        run: pnpm generate

  visual:
    name: visual
    # Визуальные регресс-тесты (#3): собранная статика × ключевые экраны × light/dark ×
    # mobile/desktop, сравнение с эталонами из tests/visual/__screenshots__.
    #
    # Отдельной джобой, а не шагом в `ci`: она тянет браузер (~120 МБ) и идёт минуты, то есть
    # удваивала бы время обратной связи по lint/typecheck/тестам — тем проверкам, которые чаще
    # всего и краснеют.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Браузер ставим playwright'ом, а не берём системный: эталоны привязаны к КОНКРЕТНОЙ
      # сборке Chromium, которую пинит версия пакета. Возьми мы системный — снимки разъехались бы
      # с эталонами на ровном месте, и тест выродился бы в шум, который все научились игнорировать.
      # Браузер весит ~170 МБ и качается на КАЖДЫЙ прогон — кэш `setup-node` покрывает только
      # pnpm-стор. Ключ по версии playwright: обновили пакет — кэш промахнулся, и это правильно,
      # эталоны всё равно надо переснимать под новый Chromium.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      - name: Install Chromium
        # `--with-deps` ставит apt-зависимости, которые в кэш не попадают, поэтому шаг идёт всегда;
        # при попадании в кэш сам браузер уже на месте и скачивание пропускается.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (nuxt generate)
        run: pnpm generate

      - name: Visual regression
        run: pnpm test:visual

      # Артефакты только при падении — по diff-картинке сразу видно, что именно уехало.
      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diff
          path: |
            tests/visual/.artifacts/
            playwright-report/
          retention-days: 7

  docker-build:
    name: docker-build
    # Validate both production images build on every PR: the nginx static landing
    # (`runner`) and the Nitro node backend (`backend`). Catches Dockerfile / base-image
    # breakage before it reaches main and the GHCR deploy. No push.
    # Runs on Dependabot PRs too — that is exactly where a node bump would surface.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      # WITHOUT THIS a failure in one leg cancels the other, and docs/REPO_SETUP_CHECKLIST.md
      # relies on the opposite: an image-build failure is harmless precisely because the other
      # image still builds.
      fail-fast: false
      matrix:
        include:
          - target: runner
            context: .
          - target: backend
            context: .

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          # READ-only on purpose. A cache written from refs/pull/N/merge is readable by
          # that PR alone, never by another PR or by main, but it still counts against the
          # repo-wide 10 GB budget. Writing here would evict the main-scope caches this job
          # actually reads from.
          # Only the deploy job (runs on main) writes a cache anyone else can use.
          cache-from: type=gha,scope=${{ matrix.target }}
          tags: ${{ matrix.target }}:ci


  deploy:
    name: Build & Push to GHCR
    needs: ci
    # Gate the deploy on CI: a red CI blocks images from ever reaching GHCR /
    # Watchtower. Only the main branch deploys (via a push or a manual
    # workflow_dispatch redeploy). Publishes two images:
    #   runner  → ghcr.io/<repo>          (nginx static landing + B24-iframe UI)
    #   backend → ghcr.io/<repo>-backend  (Nitro node: B24 webhooks + token store)
    # The BY-crypto TLS gateway used for Priorbank prod is a SEPARATE product now and
    # publishes its own image — https://github.com/bx-shef/bee2-tls-gateway.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    strategy:
      # Same reason as docker-build: one image failing to publish must not stop the other
      # from reaching GHCR.
      fail-fast: false
      matrix:
        include:
          - target: runner
            suffix: ''
            context: .
          - target: backend
            suffix: '-backend'
            context: .

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # built-in, no extra secret needed

      # Дата КОММИТА для <lastmod> в sitemap.xml (#425). Не `date -u`: стенные часы объявляли бы
      # «сегодня» на каждый передеплой неизменённого коммита, а поисковики такое обесценивают.
      - name: Commit date for sitemap lastmod
        id: builddate
        run: echo "date=$(git show -s --format=%cs ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_AUTHOR_NAME=${{ vars.NUXT_PUBLIC_AUTHOR_NAME }}
            NUXT_PUBLIC_AUTHOR_URL=${{ vars.NUXT_PUBLIC_AUTHOR_URL }}
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
            NUXT_PUBLIC_BUILD_DATE=${{ steps.builddate.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
