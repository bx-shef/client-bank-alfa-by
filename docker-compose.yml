services:
  # Static landing + in-portal iframe UI (nginx). Unchanged by the backend.
  app:
    build:
      context: .
      args:
        NUXT_PUBLIC_AUTHOR_NAME: ${NUXT_PUBLIC_AUTHOR_NAME:-}
        NUXT_PUBLIC_AUTHOR_URL: ${NUXT_PUBLIC_AUTHOR_URL:-}
        # Локальный режим форка/white-label (#39): 1 скрывает наши промо/брендинг-баннеры.
        NUXT_PUBLIC_LOCAL_MODE: ${NUXT_PUBLIC_LOCAL_MODE:-}
    # Host port 8081 (not 80) so this can run alongside currency-converter's local
    # compose on the same dev machine. Prod uses `expose` behind nginx-proxy (no clash).
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Backend (Node): Bitrix24 webhook endpoint /api/b24/events + portal token store.
  # The B24 event handler URL during install points here (e.g. behind nginx-proxy).
  backend:
    build:
      context: .
      target: backend
      args:
        # Локальный режим (#39) — симметрично статике: Nitro пререндерит те же страницы.
        NUXT_PUBLIC_LOCAL_MODE: ${NUXT_PUBLIC_LOCAL_MODE:-}
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      # application_token of the registered B24 app. REQUIRED IN PROD — without it
      # the first install is trusted on faith (TOFU); the backend logs a WARNING
      # when it bootstraps. Left optional (`:-`) only for local/dev. See docs/B24_EVENTS.md.
      B24_APPLICATION_TOKEN: ${B24_APPLICATION_TOKEN:-}
      # 32-byte key (hex/base64) encrypting portal refresh tokens at rest.
      # Required — no default, so secrets are never encrypted with a known key.
      B24_TOKEN_ENC_KEY: ${B24_TOKEN_ENC_KEY:?set B24_TOKEN_ENC_KEY (openssl rand -hex 32)}
      # App OAuth creds — refresh portal access token for server-side REST (optional locally).
      B24_CLIENT_ID: ${B24_CLIENT_ID:-}
      B24_CLIENT_SECRET: ${B24_CLIENT_SECRET:-}
      # Redis DSN for the BullMQ pipeline (events → fetch → parse → crm-sync).
      REDIS_URL: redis://redis:6379
      # Telegram alert channel (#426). Empty by default ⇒ channel OFF (fail-closed), alerts go to
      # the log and /queues. Fill these in .env to exercise alerting locally — Redis is required,
      # since the health check only runs when the queue bus is up. See docs/OPERATIONS.md.
      TELEGRAM_ALERT_BOT_TOKEN: ${TELEGRAM_ALERT_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      # Operator login for the service zone (empty PASS ⇒ open; see docs/AUTH.md).
      PUBLIC_PAGE_BASIC_AUTH_USER: ${PUBLIC_PAGE_BASIC_AUTH_USER:-operator}
      PUBLIC_PAGE_BASIC_AUTH_PASS: ${PUBLIC_PAGE_BASIC_AUTH_PASS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Cron poll interval (min) for real polling. Load demo (DEMO_LOAD_N>0): enqueues
      # synthetic fetch jobs every DEMO_TICK_SEC s with a DEMO_DELAY_MS per-job pause
      # (demo accounts only) so /queues shows a visible backlog; 0 = off.
      CRON_INTERVAL_MIN: ${CRON_INTERVAL_MIN:-5}
      DEMO_LOAD_N: ${DEMO_LOAD_N:-3}
      DEMO_TICK_SEC: ${DEMO_TICK_SEC:-5}
      DEMO_DELAY_MS: ${DEMO_DELAY_MS:-600}
    ports:
      - "3210:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Postgres: per-portal OAuth token store (table portal_tokens, auto-created on boot).
  # Published on LOOPBACK ONLY (127.0.0.1) so `pnpm dev` on the host can reach it — the documented
  # local flow in README is «docker compose up -d db redis» + `pnpm dev`, and without a host port
  # that instruction is simply false. Binding to 127.0.0.1 (not 0.0.0.0) keeps it off the network.
  # The prod compose publishes NOTHING for db/redis — there the backend runs inside the network.
  # The default app/app credentials are for local dev; the prod compose MUST set a strong
  # POSTGRES_PASSWORD (require it via `:?`, like B24_TOKEN_ENC_KEY).
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis — backing store for the BullMQ pipeline (events/fetch/parse queues).
  # Loopback-only host port, same reason as `db` above.
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
