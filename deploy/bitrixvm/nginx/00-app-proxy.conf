# Проксирование домена приложения в docker-контейнер на виртуальной машине Битрикс24.
#
# КУДА КЛАСТЬ:  /etc/nginx/bx/site_settings/<домен>/00-app-proxy.conf
# ПРОВЕРКА:     nginx -t && systemctl reload nginx
#
# ⚠ Почему именно этот каталог, а не свой server-блок. Генератор конфигов BitrixVM
# (Ansible) инклюдит его ВНУТРИ server-блока сайта с пометкой «custom options for
# sites; doesn't changes on update» — то есть правка переживает операции меню
# (перевыпуск сертификата, изменение сайта). Свой server-блок с тем же server_name
# дал бы «conflicting server name» и недетерминированный выбор блока: nginx взял бы
# первый по порядку инклюда, а это блок BitrixVM, и домен молча отдавал бы Apache.
#
# ⚠ Ключ ко всему — ПЕРЕМЕННАЯ. bx/conf/bitrix.conf проксирует не в захардкоженный
# адрес, а в $proxyserver, который сайт задаёт выше по файлу. Переопределив её здесь,
# мы забираем себе `location /`, `location ~ \.php$`, `location ~ /$` и `@fallback`
# BitrixVM целиком — без единого своего `location /`, который nginx и не принял бы
# (дубликат location в одном блоке = отказ старта).
# Порядок исполнения `set` — сверху вниз по конфигу, наш идёт после сайтового.

set $proxyserver "http://127.0.0.1:8080";

# ⚠ Статику приходится перехватывать РУКАМИ. В bx/conf/bitrix_general.conf есть
#     location ~* \.(css|js|...|woff2|map)$ { error_page 404 /404.html; expires 30d; }
# БЕЗ proxy_pass — то есть он отдаёт файл из docroot, а docroot у нас пустая
# заглушка. Весь /_nuxt/* вернул бы страницу ошибки BitrixEnv, и выглядело бы это
# как «приложение открылось, но не работает»: HTML пришёл, скрипты нет.
# Наш файл инклюдится РАНЬШЕ bitrix.conf, а среди регекс-локейшенов выигрывает
# первый совпавший по порядку определения — поэтому перехват срабатывает.
location ^~ /_nuxt/ {
    proxy_pass $proxyserver;
}

location ~* \.(css|js|mjs|map|json|txt|xml|ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|otf|eot|mp3|mp4|webm)$ {
    proxy_pass $proxyserver;
}

# `=` бьёт `^~`, поэтому наша страница 404 отдаётся нашей, а не из
# /var/www/bitrixenv_error (errors.conf объявляет её как `location ^~ /404.html`).
location = /404.html {
    proxy_pass $proxyserver;
}

# Загрузка выписки: файл едет телом запроса, кап приложения — 2 МБ, контейнерный
# nginx пропускает 3m. Внешний лимит обязан быть НЕ МЕНЬШЕ, иначе 413 прилетит
# здесь и наше сообщение об ошибке до человека не дойдёт.
client_max_body_size 8m;

# ⚠ Банковские маршруты держат соединение до 55 с (обмен кода на токен у Приорбанка;
# см. snippets/proxy-backend-slow.conf). Внешний таймаут обязан быть БОЛЬШЕ, иначе
# человек, уже введший пароль от интернет-банка, получит голый 504, а обмен на
# нашей стороне продолжится и может сохранить токен ПОСЛЕ того, как ему сказали
# «не вышло». Бюджет: 45 с (приложение) < 55 с (контейнер) < 65 с (здесь).
proxy_read_timeout 65s;
proxy_send_timeout 65s;

# HTTP/1.1 к апстриму — иначе nginx ходит 1.0 и на каждый запрос открывает соединение.
# Здесь это безопасно: в этом server-блоке апстрим ровно один — наш контейнер.
# `Connection ""` гасит хоп-бай-хоп заголовок, иначе keep-alive не включится.
proxy_http_version 1.1;
proxy_set_header Connection "";

# ⚠ Host НЕ переопределяем. Сайтовый конфиг уже задал `proxy_set_header Host $host:443`,
# а вторая директива с тем же именем не заменяет первую, а ДОБАВЛЯЕТ второй заголовок —
# апстрим получил бы два Host. Контейнеру порт в Host безразличен (server_name _),
# абсолютных адресов из Host приложение не строит: адрес берётся из NUXT_PUBLIC_SITE_URL.
#
# ⚠ X-Forwarded-For/X-Real-IP тоже уже заданы сайтовым конфигом — на них держится
# real_ip и, через него, пер-IP троттлинг входа и загрузки внутри контейнера
# (set_real_ip_from покрывает docker-мост 172.16/12).
