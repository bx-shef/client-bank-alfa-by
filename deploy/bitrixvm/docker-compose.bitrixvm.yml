# Оверлей поверх docker-compose.prod.yml для развёртывания НА ВИРТУАЛЬНОЙ МАШИНЕ
# Битрикс24 (третий тип деплоя, docs/DEPLOY_BITRIXVM.md).
#
# ЗАПУСК:
#   docker compose -f docker-compose.prod.yml -f docker-compose.bitrixvm.yml up -d
# (либо один раз прописать оба файла в COMPOSE_FILE внутри .env — так короче и
#  не даёт забыть второй файл, что молча вернуло бы базовое поведение).
#
# ⚠ Почему ОВЕРЛЕЙ, а не отдельный самодостаточный compose. В базовом файле около
# сотни переменных окружения backend/worker, и они меняются с каждой фичей. Копия
# разошлась бы с оригиналом молча: новый параметр появился бы в проде и не появился
# здесь, а заметили бы это по неработающей функции у клиента. Здесь описываются
# ТОЛЬКО отличия площадки.
#
# Отличия от основного прода ровно три:
#   1. TLS терминирует nginx самой ВМ, а не общий nginx-proxy → контейнер публикуется
#      на 127.0.0.1 и наружу не смотрит вовсе;
#   2. образы тянутся из GHCR клиентского репозитория, а не из нашего;
#   3. обновляет systemd-таймер по опросу git, а не Watchtower.
#
# ⚠ Сеть proxy-net в базовом файле объявлена external и её надо СОЗДАТЬ пустой:
#     docker network create proxy-net
#   Убрать её оверлеем нельзя — списки сетей при слиянии compose объединяются, а не
#   замещаются. Пустая сеть без nginx-proxy инертна; переменные VIRTUAL_HOST/
#   LETSENCRYPT_* и метки watchtower.enable по той же причине остаются и тоже
#   инертны — их некому читать.

services:
  app:
    # ⚠ Публикация СТРОГО на loopback. Без адреса docker слушал бы 0.0.0.0 и, что
    # хуже, сам вписал бы правило в iptables В ОБХОД firewalld — приложение оказалось
    # бы доступно по IP сервера мимо TLS и мимо всех ограничений nginx. Список
    # открытых портов при этом выглядел бы прежним.
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-8080}:8080"
    image: ${APP_IMAGE:?set APP_IMAGE (ghcr.io/<владелец>/<репозиторий>:latest)}

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE (ghcr.io/<владелец>/<репозиторий>-backend:latest)}

  worker:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE (ghcr.io/<владелец>/<репозиторий>-backend:latest)}
