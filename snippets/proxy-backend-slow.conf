# Patient backend proxy profile: the SAME shared directives, a longer read timeout.
#
# For the two bank-OAuth routes only. They wait on someone else's bank inside a single
# request and write nothing until it answers, so `proxy_read_timeout` is effectively
# «how long nginx waits for the whole reply». Cut it short and the account holder — who
# by then has already typed their internet-bank password — gets a bare `504` from nginx
# instead of our page, while the backend keeps going and may save the token AFTER they
# were told it failed and started over.
#
# The number is the middle of a three-step budget, and it is the ordering that matters:
#   TOKEN_EXCHANGE_TIMEOUT_MS (45s, server/utils/bankConnectCallback.ts)
#     < this (55s)
#     < the shared edge proxy's default (nginx's own 60s, not configured by this repo)
# so the timeout that fires is always ours and the person sees a page we wrote.
# tests/bankRouteTimeouts.test.ts pins that ordering — nothing else connects the files.
include snippets/proxy-backend-core.conf;
proxy_read_timeout 55s;
