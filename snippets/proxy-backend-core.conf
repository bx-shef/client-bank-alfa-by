# Shared backend (Nitro) proxy directives, WITHOUT the read timeout. An exact (`=`)
# location does not inherit a prefix location's directives, so without this include
# every block would be a copy and the copies could silently drift (#100). Per-location
# extras that are NOT shared (the login rate-limit `limit_req`/`limit_req_status`)
# stay in nginx.conf.
#
# ⚠ Do not include this file directly from a location — include one of the two profiles
# below it (`proxy-backend.conf` / `proxy-backend-slow.conf`), which add the timeout.
# nginx REJECTS a duplicate `proxy_read_timeout` in one context outright («directive is
# duplicate», `nginx -t` fails at image build), so a location cannot include the default
# profile and then override the number — the choice has to be made by which file it
# includes. That refusal is why the timeout lives in a wrapper at all.
#
# `resolver` + a variable upstream defer DNS to request time, so nginx still boots
# when the backend is briefly down (returns 502 instead of failing to start).
resolver 127.0.0.11 valid=30s;
set $backend_upstream http://backend:3000;
proxy_pass $backend_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Preserve the edge proxy's X-Forwarded-Proto ($forwarded_proto map in nginx.conf):
# TLS terminates upstream, so a bare $scheme here would be "http" and the backend's
# Secure-cookie logic would drop the flag on the operator session (#242 P2). Falls
# back to $scheme when the header is absent (local compose with no edge).
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# Manual statement upload (POST /api/import) carries the file — allow up to the app's
# MAX_UPLOAD_BYTES (2 МБ) + multipart overhead; nginx default (1m) would 413 a 2МБ file.
client_max_body_size 3m;
