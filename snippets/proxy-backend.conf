# Default backend proxy profile: the shared directives + a SNAPPY read timeout.
# Webhook/API bodies are small and the handlers behind them are fast, so a request
# that goes quiet for half a minute is broken, not slow.
#
# The two routes that legitimately wait on a bank use `proxy-backend-slow.conf`
# instead — see there for why they cannot simply override the number here.
include snippets/proxy-backend-core.conf;
proxy_read_timeout 30s;
