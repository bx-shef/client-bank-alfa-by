# Продакшн — разместить на сервере в /home/bitrix/bank-import/
# Требует:
#   - docker network proxy-net (создаётся nginx-proxy setup —
#     см. currency-converter/docker-compose.nginxproxy.yml);
#   - запущенный Watchtower на хосте (тоже из currency-converter) — он один на
#     сервер и сам подхватит контейнеры по метке watchtower.enable ниже.
#   - .env с DOMAIN, LETSENCRYPT_EMAIL, POSTGRES_PASSWORD, B24_TOKEN_ENC_KEY
#     (B24_APPLICATION_TOKEN — опционален: см. .env.example и комментарий у сервиса backend).
# Свой Watchtower здесь НЕ поднимаем: второй экземпляр конфликтует по
# container_name и плодит двойные перезапуски (см. docs/DEPLOY.md).
#
# Один домен, две роли: nginx `app` отдаёт статику лендинга/UI и проксирует
# /api/* в `backend` (Nitro) — поэтому вебхук B24 живёт на https://<DOMAIN>/api/b24/events
# без CORS. Наружу (nginx-proxy) смотрит только `app`; backend и db — во внутренней сети.

# Ротация логов (docs/OPERATIONS.md «Логи и ротация»). В логи воркера попадают номера счетов,
# поэтому окно хранения ограничено СОЗНАТЕЛЬНО: без этого блока docker пишет json-file без предела
# — финансовые ПДн копятся бессрочно и попутно переполняют диск. При --scale worker=N лимит
# действует на каждую реплику.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"
services:
  app:
    logging: *default-logging
    image: ghcr.io/bx-shef/client-bank-alfa-by:latest
    container_name: client-bank-alfa-by
    # 8080: the image runs nginx unprivileged (non-root) on 8080.
    expose:
      - "8080"
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${DOMAIN}
      # Per-vhost ACME contact email; overrides acme-companion's global
      # DEFAULT_EMAIL. Empty is allowed (cert issued without an account email).
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    restart: unless-stopped
    healthcheck:
      # ⚠ Именно 127.0.0.1, а не localhost. nginx слушает `listen 8080;` — это ТОЛЬКО IPv4, а
      # `localhost` в контейнере резолвится и в `::1`. Если busybox-wget сходит по IPv6 первым,
      # проверка получит «Connection refused» при полностью живом сервере — контейнер будет
      # висеть unhealthy сутками, и искать будут поломку, которой нет.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy-net   # fronted by the external nginx-proxy
      - internal    # to reach `backend` for the /api/ proxy_pass
    depends_on:
      # best-effort ordering; nginx.conf resolves `backend` lazily and returns 502
      # if it's briefly down, so app never fails to start on backend readiness.
      - backend
    labels:
      # Picked up by the single host-wide Watchtower (deployed once with
      # currency-converter, runs with --label-enable).
      - "com.centurylinklabs.watchtower.enable=true"

  backend:
    logging: *default-logging
    image: ghcr.io/bx-shef/client-bank-alfa-by-backend:latest
    container_name: client-bank-alfa-by-backend
    # No host port and NOT on proxy-net — reached only via app's /api/ proxy_pass.
    expose:
      - "3000"
    volumes:
      # Только на чтение: набор поддерживается дистрибутивом хоста, мы его не редактируем.
      # Путь переопределяется через HOST_CA_BUNDLE, если в системе он лежит иначе.
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/host-ca-bundle.crt:ro
    environment:
      # ⚠ Корни доверия — ХОСТОВЫЕ, а не встроенные в Node. Node возит собственный список корней, и
      # он НЕ совпадает с системным: боевой эндпоинт Альфа-Банка выстраивает цепочку до корня
      # `AAA Certificate Services`, которого во встроенном списке нет. Замерено 2026-08-14: с той же
      # машины `curl` и `openssl` проходят, а из контейнера каждый вызов умирает на
      # SELF_SIGNED_CERT_IN_CHAIN — и выглядит это как «банк не отвечает», а не как вопрос доверия.
      # `NODE_EXTRA_CA_CERTS` ДОБАВЛЯЕТ корни к встроенным, ничего не подменяя, поэтому отсутствие
      # файла возвращает прежнее поведение, а не ослабляет проверку. Проверку сертификата не
      # отключаем никогда — это единственный способ отличить банк от того, кто им притворился.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/host-ca-bundle.crt
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/app
      # AES-256-GCM key for portal refresh tokens at rest. Required — no default.
      B24_TOKEN_ENC_KEY: ${B24_TOKEN_ENC_KEY:?set B24_TOKEN_ENC_KEY (openssl rand -hex 32)}
      # Прежний ключ — только на время ротации (docs/OPERATIONS.md). Без проброса ротация
      # невозможна: смена ключа осиротила бы все сохранённые refresh-токены.
      B24_TOKEN_ENC_KEY_OLD: ${B24_TOKEN_ENC_KEY_OLD:-}
      # application_token is delivered INSIDE ONAPPINSTALL (per portal) and stored
      # write-once; later events are verified against that stored value. So leave
      # this EMPTY for multi-tenant — the first install bootstraps trust. It's used
      # here only as the guard token for the server-only diagnostic
      # (/api/queues); set it to enable that.
      B24_APPLICATION_TOKEN: ${B24_APPLICATION_TOKEN:-}
      # App OAuth creds — refresh portal access token for server-side REST (optional
      # for a just-installed portal, required for long-lived operation).
      B24_CLIENT_ID: ${B24_CLIENT_ID:-}
      B24_CLIENT_SECRET: ${B24_CLIENT_SECRET:-}
      # Redis DSN for the BullMQ pipeline (events → fetch → parse → crm-sync). Reached
      # only on the isolated `queuenet`; no auth needed inside the private network.
      REDIS_URL: redis://redis:6379
      # Operator login for the service zone (/queues …). Empty PASS ⇒ zone OPEN (no
      # login). Set PASS to close it; SESSION_SECRET is the independent HMAC signing
      # key (required in prod, must NOT be derived from the password). See docs/AUTH.md.
      PUBLIC_PAGE_BASIC_AUTH_USER: ${PUBLIC_PAGE_BASIC_AUTH_USER:-operator}
      PUBLIC_PAGE_BASIC_AUTH_PASS: ${PUBLIC_PAGE_BASIC_AUTH_PASS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Cron poll interval (minutes) for real polling. Load demo: DEMO_LOAD_N>0
      # enqueues that many synthetic fetch jobs every DEMO_TICK_SEC seconds, with a
      # DEMO_DELAY_MS per-job pause (demo accounts only) so the /queues chart shows a
      # visible backlog. 0 = off. See docs/QUEUES.md.
      CRON_INTERVAL_MIN: ${CRON_INTERVAL_MIN:-5}
      # За сколько дней назад просить выписку на каждом тике. Без этой строки окно всегда
      # [вчера, сегодня] — и первый живой прогон выглядит так: клиент подтвердил согласие, а
      # операций за прошлую неделю нет. Симптом «банк не отдаёт историю», причина — забытая
      # переменная, которая есть в коде и в .env.example, но не доезжала до контейнера.
      CRON_LOOKBACK_DAYS: ${CRON_LOOKBACK_DAYS:-1}
      # Период обновления БАНКОВСКИХ refresh-токенов (мин, дефолт 60). ⚠ Живёт на крон-инстансе,
      # то есть здесь. Не гейтится `CRON_REAL_POLL`: тот флаг про выписку, а обновление токена
      # выпиской не является — из-за сцепки этих двух вещей подключение Альфы умирало за ночь (#488).
      BANK_KEEPALIVE_MINUTES: ${BANK_KEEPALIVE_MINUTES:-60}
      DEMO_LOAD_N: ${DEMO_LOAD_N:-0}
      DEMO_TICK_SEC: ${DEMO_TICK_SEC:-5}
      DEMO_DELAY_MS: ${DEMO_DELAY_MS:-600}
      # Queue role: this container serves the API + runs the cron scheduler + the single
      # `b24-events` worker (install/uninstall — kept on one instance for ordering), but
      # does NOT process fetch/parse/crm-sync — those are drained by the `worker` service
      # below (scale it for throughput). RUN_MIGRATION stays on (default) so backend owns
      # the schema. ⚠ With QUEUE_WORKERS=0, the `worker` service MUST be up — else webhooks
      # /imports enqueue fine (Redis is up) and then sit undrained SILENTLY. Bring the WHOLE
      # compose up (`docker compose -f docker-compose.prod.yml up -d`), don't hand-edit only
      # this env; verify via /queues or `make queue-stats` after deploy.
      QUEUE_WORKERS: "0"
      # --- Online bank connect + polling (stage 5). MUST be declared here: compose passes
      # ONLY the vars listed in this block, so anything merely present in `.env` never
      # reaches the container. Missing them made /api/bank/connect answer
      # «provider alfa-by not available» (fail-closed) no matter what the operator set.
      # Per bank, connect needs CLIENT_ID + TOKEN_URL + REDIRECT_URI, and refresh needs
      # CLIENT_ID + CLIENT_SECRET + TOKEN_URL. ⚠ envCheck warns at boot only about a partial
      # REFRESH triple — a missing REDIRECT_URI boots CLEAN and then fails the connect with
      # the same opaque «provider … not available» 400. Check it by hand.
      # See .env.example for the values.
      ALFA_OAUTH_CLIENT_ID: ${ALFA_OAUTH_CLIENT_ID:-}
      ALFA_OAUTH_CLIENT_SECRET: ${ALFA_OAUTH_CLIENT_SECRET:-}
      ALFA_OAUTH_TOKEN_URL: ${ALFA_OAUTH_TOKEN_URL:-}
      ALFA_OAUTH_REDIRECT_URI: ${ALFA_OAUTH_REDIRECT_URI:-}
      ALFA_OAUTH_SCOPE: ${ALFA_OAUTH_SCOPE:-accounts}
      ALFA_OAUTH_API_BASE: ${ALFA_OAUTH_API_BASE:-}
      ALFA_OAUTH_API_PREFIX: ${ALFA_OAUTH_API_PREFIX:-/partner/1.2.0}
      PRIOR_OAUTH_CLIENT_ID: ${PRIOR_OAUTH_CLIENT_ID:-}
      PRIOR_OAUTH_CLIENT_SECRET: ${PRIOR_OAUTH_CLIENT_SECRET:-}
      PRIOR_OAUTH_TOKEN_URL: ${PRIOR_OAUTH_TOKEN_URL:-}
      PRIOR_OAUTH_REDIRECT_URI: ${PRIOR_OAUTH_REDIRECT_URI:-}
      PRIOR_OAUTH_AUDIENCE: ${PRIOR_OAUTH_AUDIENCE:-}
      # ⚠ A REAL multiline PEM (quoted heredoc-style value in .env). A one-line paste with
      # literal `\n` is never unescaped: the config looks valid, so there is no fail-closed
      # 400 — signPriorJwt throws later and the connect answers an opaque 502 instead.
      PRIOR_OAUTH_PRIVATE_KEY: ${PRIOR_OAUTH_PRIVATE_KEY:-}
      PRIOR_OAUTH_KID: ${PRIOR_OAUTH_KID:-}
      # Token-endpoint client auth (#444). Default = the sandbox method; PROD requires
      # `private_key_jwt`. Unset here ⇒ setting it in `.env` does nothing and the app keeps
      # sending the client secret to an endpoint that refuses it (opaque 401).
      PRIOR_OAUTH_AUTH_METHOD: ${PRIOR_OAUTH_AUTH_METHOD:-}
      PRIOR_OAUTH_API_BASE: ${PRIOR_OAUTH_API_BASE:-}
      # Origin the ADMIN'S BROWSER opens for the bank's authorize page (#455). Defaults to
      # API_BASE; set it only when API_BASE points at the internal crypto gateway — an
      # internal address in the browser URL kills the connect SILENTLY (the server never
      # makes that request, so nothing fails on our side). Must be a PUBLIC https origin.
      PRIOR_OAUTH_AUTHORIZE_BASE: ${PRIOR_OAUTH_AUTHORIZE_BASE:-}
      # Feature gates: real cron polling (default OFF) and the admin «Опросить сейчас».
      CRON_REAL_POLL: ${CRON_REAL_POLL:-0}
      MANUAL_POLL_ENABLED: ${MANUAL_POLL_ENABLED:-0}
      MANUAL_POLL_COOLDOWN_SEC: ${MANUAL_POLL_COOLDOWN_SEC:-}
      # ⚠ Distribution contour is ON by default and CREATES smart processes in the client's CRM.
      # Without this line the documented opt-out (`DISTRIBUTION_PROVISION_ENABLED=0` in .env) is
      # silently ignored — compose passes ONLY what is listed here.
      DISTRIBUTION_PROVISION_ENABLED: ${DISTRIBUTION_PROVISION_ENABLED:-}
      # Self-hosted portals: without this the SSRF host allowlist rejects them and there is no
      # way to fix it from .env alone.
      B24_SELFHOSTED_HOSTS: ${B24_SELFHOSTED_HOSTS:-}
      # Employee feedback channel (docs/FEEDBACK.md) — fail-closed without the pair, and the
      # widget silently stays hidden, which is indistinguishable from «not configured».
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-}
      # Privacy/retention knobs (docs/PRIVACY.md). Defaults are the safe ones, but the docs
      # promise they are configurable — they are not unless declared here.
      STATEMENT_SWEEP: ${STATEMENT_SWEEP:-}
      STATEMENT_SWEEP_INTERVAL_MIN: ${STATEMENT_SWEEP_INTERVAL_MIN:-}
      TOMBSTONE_TTL_DAYS: ${TOMBSTONE_TTL_DAYS:-}
      PENDING_MAX_AGE_DAYS: ${PENDING_MAX_AGE_DAYS:-}
      TOKEN_KEEPALIVE_HOURS: ${TOKEN_KEEPALIVE_HOURS:-}
      QUEUE_FETCH_SATURATION_THRESHOLD: ${QUEUE_FETCH_SATURATION_THRESHOLD:-}
      # Telegram alert channel (#426, docs/OPERATIONS.md). ONLY here, not on `worker`: the queue
      # health check runs on the cron instance (QUEUE_CRON=1), so one voice speaks for the whole
      # pipeline. Passing them to a scaled `worker` would give N copies of every alert.
      # Fail-closed without the pair — alerts then stay in the log and on /queues.
      TELEGRAM_ALERT_BOT_TOKEN: ${TELEGRAM_ALERT_BOT_TOKEN:-}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      # Telemetry (docs/OBSERVABILITY.md): no endpoint ⇒ the OTel bootstrap is a no-op.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    # Makes `docker compose ps` show backend health at a glance.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal   # reached by app's /api proxy + outbound to B24/Alfa
      - dbnet       # to reach Postgres
      - queuenet    # to reach Redis (BullMQ)
      # - cryptonet # BY-crypto gateway (Prior prod) — uncomment with the crypto-gw service
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Worker — drains the BullMQ queues (events/fetch/parse/crm-sync). Same image as
  # backend, but role = worker-only: QUEUE_CRON=0 (cron runs on backend) and
  # RUN_MIGRATION=0 (schema owned by backend). No container_name / no ports so it can
  # be scaled: `docker compose up -d --scale worker=N` (or bump `deploy.replicas`).
  # All replicas pull from the same Redis — each job goes to exactly one worker, so
  # adding replicas adds throughput (see docs/QUEUES.md «Масштабирование»).
  worker:
    logging: *default-logging
    image: ghcr.io/bx-shef/client-bank-alfa-by-backend:latest
    volumes:
      # Только на чтение: набор поддерживается дистрибутивом хоста, мы его не редактируем.
      # Путь переопределяется через HOST_CA_BUNDLE, если в системе он лежит иначе.
      - ${HOST_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}:/etc/ssl/certs/host-ca-bundle.crt:ro
    environment:
      # Тот же хостовой набор корней, что у backend: опрос выписки ходит в те же банки.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/host-ca-bundle.crt
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/app
      B24_TOKEN_ENC_KEY: ${B24_TOKEN_ENC_KEY:?set B24_TOKEN_ENC_KEY (openssl rand -hex 32)}
      # Прежний ключ — только на время ротации (docs/OPERATIONS.md). Без проброса ротация
      # невозможна: смена ключа осиротила бы все сохранённые refresh-токены.
      B24_TOKEN_ENC_KEY_OLD: ${B24_TOKEN_ENC_KEY_OLD:-}
      B24_CLIENT_ID: ${B24_CLIENT_ID:-}
      B24_CLIENT_SECRET: ${B24_CLIENT_SECRET:-}
      REDIS_URL: redis://redis:6379
      # Те же креды операторской зоны, что у backend. Воркер — тот же Nitro-образ, он поднимает
      # HTTP на :3000 во внутренней сети, то есть `/api/ops/*` у него ТОЖЕ есть. Наружу их не
      # проксируют (nginx ходит в `backend`), но оставлять их открытыми внутри — ровно та же
      # ошибка «не настроено = разрешено», из-за которой утекали member_id порталов.
      # Без этих строк воркер вдобавок ругался бы на старте на «незаданный пароль» вхолостую.
      PUBLIC_PAGE_BASIC_AUTH_USER: ${PUBLIC_PAGE_BASIC_AUTH_USER:-operator}
      PUBLIC_PAGE_BASIC_AUTH_PASS: ${PUBLIC_PAGE_BASIC_AUTH_PASS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Role: process jobs, don't schedule, don't migrate.
      QUEUE_CRON: "0"
      RUN_MIGRATION: "0"
      # Per-worker parallelism for fetch/parse/crm-sync (default 1). Raise with care:
      # crm-sync is REST-bound and B24 limits are per-portal — batch first (docs/QUEUES.md).
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-1}
      # Раскрыть НАЗНАЧЕНИЕ ПЛАТЕЖА в логе операций (`[op]`). ⚠ Осознанное временное послабление
      # docs/PRIVACY.md §Логи — включают на время калибровки «карты сопоставления» (маску нельзя
      # написать для нумерации, которую ни разу не видел) и ВЫКЛЮЧАЮТ обратно. Ровно тот же
      # порядок, что с уровнем error-лога крипто-шлюза. Нужна ИМЕННО ЗДЕСЬ: crm-sync крутится на
      # воркере, на backend переменная не сделает ничего.
      STATEMENT_DEBUG_LOG: ${STATEMENT_DEBUG_LOG:-0}
      # Подробность построчного лога операций (#498): notable (умолчание) | all | off.
      # Замер: строка `[op]` — 221 байт с обвязкой docker, и на «10 порталов × 100 оплат/мин» одна
      # она сжимает историю логов до ЧЕТЫРЁХ часов (а с распознаванием — до полутора). По умолчанию
      # печатаем только НЕ приземлившиеся операции: у приземлившейся авторитетная запись — само
      # дело в Bitrix24, оно точнее строки лога и не истекает. ⚠ `off` глушит и диагностику —
      # это аварийный клапан, а не «тихий прод». Здесь же, а не на backend: crm-sync на воркере.
      STATEMENT_OP_LOG: ${STATEMENT_OP_LOG:-}
      # Global A8 rate limiter — attached HERE (the fetch workers), so these knobs are inert
      # unless passed to this service. The default 100/60s sits right AT Alfa's own ceiling
      # with no headroom, so lower it here if the bank starts throttling. Prior is budgeted
      # in REQUESTS (its job costs ~10) on its own queue, hence the separate pair.
      QUEUE_FETCH_RATE_MAX: ${QUEUE_FETCH_RATE_MAX:-}
      QUEUE_FETCH_RATE_DURATION_MS: ${QUEUE_FETCH_RATE_DURATION_MS:-}
      QUEUE_PRIOR_RATE_MAX: ${QUEUE_PRIOR_RATE_MAX:-}
      QUEUE_PRIOR_RATE_DURATION_MS: ${QUEUE_PRIOR_RATE_DURATION_MS:-}
      QUEUE_PRIOR_CONCURRENCY: ${QUEUE_PRIOR_CONCURRENCY:-}
      # Bank creds for the FETCH path: this service actually polls the banks
      # (fetchBankStatement) and refreshes the stored bank token (ensureBankToken), so it
      # needs the same client creds + hosts as backend. `REDIRECT_URI` stays backend-only —
      # the worker never builds an authorize URL.
      ALFA_OAUTH_CLIENT_ID: ${ALFA_OAUTH_CLIENT_ID:-}
      ALFA_OAUTH_CLIENT_SECRET: ${ALFA_OAUTH_CLIENT_SECRET:-}
      ALFA_OAUTH_TOKEN_URL: ${ALFA_OAUTH_TOKEN_URL:-}
      ALFA_OAUTH_API_BASE: ${ALFA_OAUTH_API_BASE:-}
      ALFA_OAUTH_API_PREFIX: ${ALFA_OAUTH_API_PREFIX:-/partner/1.2.0}
      PRIOR_OAUTH_CLIENT_ID: ${PRIOR_OAUTH_CLIENT_ID:-}
      PRIOR_OAUTH_CLIENT_SECRET: ${PRIOR_OAUTH_CLIENT_SECRET:-}
      PRIOR_OAUTH_TOKEN_URL: ${PRIOR_OAUTH_TOKEN_URL:-}
      PRIOR_OAUTH_API_BASE: ${PRIOR_OAUTH_API_BASE:-}
      # ⚠ Under `private_key_jwt` (prod, #444) the REFRESH also signs a client_assertion, and the
      # refresh runs HERE, not on backend. Without this quartet `priorRefreshAuthFromEnv` throws on
      # every Prior poll tick — a deploy slip that only shows up hours later, when the first stored
      # access token expires. AUTHORIZE_BASE is deliberately absent: browser-facing, backend-only.
      PRIOR_OAUTH_AUTH_METHOD: ${PRIOR_OAUTH_AUTH_METHOD:-}
      PRIOR_OAUTH_AUDIENCE: ${PRIOR_OAUTH_AUDIENCE:-}
      PRIOR_OAUTH_PRIVATE_KEY: ${PRIOR_OAUTH_PRIVATE_KEY:-}
      PRIOR_OAUTH_KID: ${PRIOR_OAUTH_KID:-}
      # SSRF-allowlist хоста портала. Нужен ИМЕННО ЗДЕСЬ: `assertPortalHost` вызывается на
      # stored-token-пути SDK, а это и есть crm-sync, который крутится на воркере. Без переменной
      # self-hosted портал подключается и настраивается (это backend), а запись в CRM отваливается —
      # отказ в другом месте и в другое время, чем причина.
      B24_SELFHOSTED_HOSTS: ${B24_SELFHOSTED_HOSTS:-}
      # Канал отзывов поднимается на воркере (`startFeedbackWorker` при role.workers), и конфиг
      # резолвится из ЕГО env. Без пары отправка возвращает «не настроено» и задача дропается —
      # отзыв сотрудника исчезает молча, хотя виджет в портале показан.
      GITHUB_FEEDBACK_TOKEN: ${GITHUB_FEEDBACK_TOKEN:-}
      GITHUB_FEEDBACK_REPO: ${GITHUB_FEEDBACK_REPO:-}
      # Телеметрия (docs/OBSERVABILITY.md). ⚠ Нужна ИМЕННО ЗДЕСЬ, а не только на backend: джоб-спаны
      # (`crm-sync`, `bank-fetch`, `trigger-fire`) и зависимости, которые CLAUDE.md обязывает
      # покрывать, исполняются на ВОРКЕРЕ. Образ один, бутстрап вшит через NODE_OPTIONS, но без
      # endpoint'а в env этого контейнера SDK остаётся выключенным — и дашборд показывает приложение,
      # которое якобы только отдаёт HTTP и ни разу не обрабатывает платёж.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      # Отдельное имя сервиса: иначе спаны воркера и backend'а сольются в один сервис, и «кто
      # именно встал» придётся выяснять по атрибутам вместо того, чтобы видеть сразу.
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_WORKER:-${OTEL_SERVICE_NAME:-}}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # Give an in-flight crm-sync REST job time to finish on scale-down before SIGKILL
    # (Docker default is 10s). A killed job is re-queued anyway (at-least-once + dedup),
    # but draining cleanly avoids needless retries.
    stop_grace_period: 30s
    # Scale knob. NB: plain `docker compose up` IGNORES `deploy.replicas` (Swarm/
    # `--compatibility` only) — the real knob is `docker compose up -d --scale worker=N`.
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy
      # Start after backend (which owns the migration). NB: `service_started` fires when
      # backend's process starts, NOT when its async migration finished — so a worker
      # could briefly hit a not-yet-created table; BullMQ retry (attempts:3, backoff)
      # covers that window against the idempotent CREATE TABLE IF NOT EXISTS.
      backend:
        condition: service_started
    networks:
      - internal   # outbound to B24/Alfa for REST writes
      - dbnet      # Postgres (token store, dedup)
      - queuenet   # Redis (BullMQ)
      # - cryptonet # BY-crypto gateway — the worker polls Prior and refreshes its token too
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Redis — backing store for the BullMQ pipeline. Only on `queuenet` (internal:
  # true): no host port, no egress, reachable solely by backend/worker. Durable
  # (appendonly) so queued jobs survive a restart.
  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: client-bank-alfa-by-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - queuenet

  db:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: client-bank-alfa-by-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dbnet

  # --- BY-крипто TLS-шлюз для ПРОДА Приорбанка (#41 / #455 / #460) -------------
  # Боевой Open Banking Приора говорит по СТБ 34.101.65 — Node на нём обрывается на
  # ServerHello. Шлюз принимает обычный HTTP внутри и переоткрывает запрос к банку по
  # BY-крипто на ОТКРЫТОЙ реализации (bee2evp, Apache 2.0). Проприетарное СКЗИ и ключ
  # ГосСУОК тут не участвуют: аутентификация сервера односторонняя, а наша — своим
  # RSA-ключом через private_key_jwt (#444).
  #
  # ⚠ Сам шлюз живёт в ОТДЕЛЬНОМ репозитории и публикует собственный образ:
  # https://github.com/bx-shef/bee2-tls-gateway — там устройство образа, гейты сборки,
  # замеры, предупреждение про CPU и порядок эксплуатации. Здесь остаётся только то, что
  # относится к НАМ как к потребителю: как его подключить и какие адреса переставить.
  #
  # ⚠ ВЫКЛЮЧЕН ПО УМОЛЧАНИЮ. Раскомментировать вместе с `cryptonet` внизу И строками
  # `- cryptonet` в networks у backend/worker — иначе шлюз поднимется, а обратиться к нему
  # будет некому. Плюс переставить адреса (см. ниже).
  #
  # Зачем именно так:
  #  - НЕТ `ports:` — порт наружу не публикуется. Шлюз НИКОГО НЕ АУТЕНТИФИЦИРУЕТ: кто
  #    дотянулся до порта, тот ходит в банк. Backend видит его по имени сервиса внутри
  #    `cryptonet`, и этого достаточно.
  #  - Корни ГосСУОК монтируются ТОМОМ, а не берутся из слоя образа: перевыпуск корней
  #    иначе означает пересборку и передеплой ровно тогда, когда импорт уже стоит.
  #    В образе лежит только эталонная копия — для гейта сборки.
  #    ⚠ Путь задаётся ЯВНО через `PRIOR_GW_CA_DIR` и намеренно без дефолта. На прод-сервере
  #    лежат только `docker-compose.prod.yml`, `Makefile` и `.env` (docs/DEPLOY.md) — репозитория
  #    там нет, поэтому относительный путь docker молча создал бы ПУСТЫМ каталогом, и шлюз
  #    ушёл бы в restart-loop на проверке корней. Каталог создаёт оператор, положив туда
  #    `gossuok-bundle.pem` (и `bank-leaf-reference.pem`, если хочет, чтобы работала
  #    проверка цепочки на старте).
  #  - `cpus` — потолок против вечного цикла в источнике энтропии bee2. ⚠ Причина УСТРАНЕНА в
  #    образе (шлюз наложил открытый патч апстрима bee2 на поток-счётчик jitter, замер: 5,089 с
  #    против 0,064 с процессорного времени), но лимит и `nice` сняты НЕ будут до живого прогона:
  #    замер сделан на голом bee2, а не на образе под трафиком. До тех пор считать, что образ
  #    может жечь ядро, и не разворачивать его на burstable-инстансах с CPU-кредитами.
  #  - Наш код обращается к шлюзу обычным HTTP (`PRIOR_OAUTH_API_BASE=http://crypto-gw:1080`) —
  #    крипто-TLS поднимает сам шлюз. ⚠ `PRIOR_OAUTH_TOKEN_URL` переставить ВМЕСТЕ с ним (это
  #    независимая переменная), а `PRIOR_OAUTH_AUTHORIZE_BASE` ОБЯЗАН остаться публичным адресом
  #    банка: этот URL открывает браузер администратора, и внутренний адрес там убивает
  #    подключение молча, без ошибки на сервере. `envCheck` предупредит про оба случая.
  #    `PRIOR_OAUTH_AUDIENCE` не трогать вообще — это claim внутри подписанного JWT, не адрес.
  #
  # crypto-gw:
  #   logging: *default-logging
  #   # Собирать на сервере нечем и незачем — образ публикует свой репозиторий (собрать его
  #   # на проде = поставить туда компилятор и исходники OpenSSL).
  #   # ⚠ Watchtower этот контейнер НЕ трогает (он запущен с `--label-enable`, а метки
  #   # `com.centurylinklabs.watchtower.enable` тут намеренно нет — в отличие от app/backend/
  #   # worker выше). Опасность другая: `make prod-redeploy` делает `pull`, и ЛЮБОЙ подвижный
  #   # тег при этом молча подменил бы TLS-терминатор на регулируемом платёжном пути. Отсюда
  #   # DIGEST, а не тег: у шлюза `v1` **движется каждым мержем** (сказано в его README), то
  #   # есть пин по нему — это согласие на такую подмену. Обновлять digest тем же осознанным
  #   # ручным порядком, что принят для пинов внутри самого образа.
  #   # ✅ Прогнан против БОЕВОГО банка 2026-08-14 из нашего стека: `route=token method=POST
  #   # status=200 upstream=200` на токене A и `route=ob … upstream=401` на ресурсном API — то
  #   # есть рукопожатие по СТБ 34.101.65 состоялось, и не в отрыве, а по цепочке
  #   # backend → crypto-gw → банк. nginx 1.30.4 (шлюз ушёл с ветки 1.28 из-за CVE-2026-1642 /
  #   # CVE-2026-42533). Порядок прогона — docs/OPERATIONS.md.
  #   # ⚠ Пин ОБНОВЛЁН с `a59299a9…` (коммит 0b9bd7c): тот образ НЕ ЗНАЛ про `GW_ALLOW` —
  #   # переменную добавили в ee97747, а 0b9bd7c ушёл параллельной веткой и её не содержит.
  #   # Симптом обмана был бесшумным: переменная задана, контейнер стартовал, маршруты остались
  #   # прежними, и в логе ни слова — искать причину пришлось в истории чужого репозитория.
  #   # Признак, что образ переменную ПОНИМАЕТ: строка `[crypto-gw] allowlist: разрешено
  #   # маршрутов — N` в логе при старте. Нет строки — образ старый, что бы ни стояло в .env.
  #   # ⚠ Обновляя digest: прогонять ЗАНОВО (зелёный CI шлюза доказывает сборку и старт, но не то,
  #   # что банк по-прежнему отвечает) и запускать `make doctor` — он ищет в логе
  #   # строку `allowlist: разрешено маршрутов — N`, по которой видно, что образ вообще понимает
  #   # `GW_ALLOW`. Без неё переменная игнорируется молча.
  #   # ⚠ Привязка digest к исходнику ТОЛЬКО по времени сборки: образ не несёт метки
  #   # `org.opencontainers.image.revision` (проверено в реестре 2026-08-15), поэтому какой коммит
  #   # внутри — из самого образа не узнать. Этот собран 2026-08-14T18:19:29Z, что совпадает по
  #   # времени с коммитом `3a0b036` шлюза. Метку просим добавить: bee2-tls-gateway#69.
  #   image: ghcr.io/bx-shef/bee2-tls-gateway@sha256:a3e2637fd01c4aa7d5644f6e2108efb4b2fe42c4fd258b705a5aa5e1a5e362e8
  #   container_name: client-bank-alfa-by-crypto-gw
  #   environment:
  #     GW_UPSTREAM_HOST: ${PRIOR_GW_UPSTREAM_HOST:-apibel.priorbank.by}
  #     GW_UPSTREAM_PORT: ${PRIOR_GW_UPSTREAM_PORT:-9345}
  #     # На живой прогон поднять до info, потом вернуть: на уровне error nginx печатает
  #     # строку запроса целиком, а в ней едет номер счёта.
  #     GW_ERROR_LOG_LEVEL: ${PRIOR_GW_LOG_LEVEL:-crit}
  #     # Список разрешённых маршрутов. Задан ЯВНО, хотя у образа есть своё умолчание с теми же
  #     # двумя записями: так видно, что именно открыто, не заглядывая в чужой репозиторий, и
  #     # так `PRIOR_GW_ALLOW` не может случайно закрыть всё. ⚠ Подставлять сюда `:-` с ПУСТЫМ
  #     # значением нельзя: в шлюзе `GW_ALLOW=''` — это осознанное «ни одного маршрута»
  #     # (entrypoint.sh использует `${GW_ALLOW-…}`, через `-`), то есть опечатка в .env положила
  #     # бы интеграцию целиком. Отсюда непустое умолчание прямо в этой строке.
  #     #
  #     # ⚠ Переменная ЗАМЕНЯЕТ список, а не дополняет его. Расширяя, всегда переписывай ОБА
  #     # прежних маршрута — иначе опрос выписки встанет ради разовой операции.
  #     # ⚠ Значение читается только при старте: после правки нужен `up -d --force-recreate`,
  #     # иначе симптом неотличим от неоткрытого маршрута — тот же 404 и `upstream=-`.
  #     # Регистрация приложения (DCR) требует более широкого списка на время процедуры —
  #     # готовая строка и порядок в docs/OPERATIONS.md.
  #     GW_ALLOW: ${PRIOR_GW_ALLOW:-POST =/open-banking-authorize/v1.0/oauth2/token; GET,POST /open-banking/v1.0/}
  #   volumes:
  #     - ${PRIOR_GW_CA_DIR:?set PRIOR_GW_CA_DIR}:/etc/crypto-gw/ca:ro
  #   # Единственный контейнер стека, который ходит напрямую в боевой банк, — и по устройству
  #   # он пишет только в /tmp. Раз так, запереть остальное почти бесплатно.
  #   read_only: true
  #   tmpfs:
  #     - /tmp
  #   cap_drop: [ALL]
  #   security_opt:
  #     - no-new-privileges:true
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '1.5'
  #   restart: unless-stopped
  #   networks:
  #     - cryptonet

volumes:
  pgdata:
  redisdata:

networks:
  proxy-net:
    external: true
  # app ↔ backend, and the backend's outbound to Bitrix24/Alfa (so NOT internal).
  internal:
    driver: bridge
  # backend ↔ Postgres only. `internal: true` — no outbound: the DB is fully
  # isolated (can't be reached from outside and can't initiate egress).
  dbnet:
    driver: bridge
    internal: true
  # backend/worker ↔ Redis only. `internal: true` — Redis has no host port and
  # no egress; it never leaves this private network. Other stacks can't see it.
  queuenet:
    driver: bridge
    internal: true
  # backend/worker ↔ BY-crypto TLS gateway (Приорбанк прод, #41/#455). NOT `internal`:
  # unlike Redis, the gateway's whole job is to reach the bank, so it needs egress.
  # It still gets its own network and NO published host port — see the service below.
  # cryptonet:
  #   driver: bridge
